[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livereload"
dynamic = ["version"]
description = "Python LiveReload is an awesome tool for web developers"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Hsiaoming Yang", email = "me@lepture.com" }]
requires-python = ">=3.9"
dependencies = ["tornado"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment :: Mozilla",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/lepture/python-livereload"
Documentation = "https://livereload.readthedocs.io"
Source = "https://github.com/lepture/python-livereload"
Changelog = "https://github.com/lepture/python-livereload/blob/master/CHANGES.rst"

[project.scripts]
livereload = "livereload.cli:main"

[tool.hatch.version]
path = "src/livereload/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/livereload"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/CHANGES.rst"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["pyinotify", "django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# BaseCommand is untyped without django-stubs.
module = "livereload.management.*"
disallow_subclassing_any = false

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "ruff>=0.17.1",
    "typing-extensions>=4.16.0",
]

[tool.ruff]
src = ["src"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
