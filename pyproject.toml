[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.26" ]

[project]
name = "livereload"
description = "Python LiveReload is an awesome tool for web developers"
readme = "README.md"
# TODO: add more keywords in here
keywords = [
  "livereload",
]
license = "BSD-3-Clause"
license-files = [ "LICEN[CS]E*" ]
maintainers = [ { name = "Bubu-Droid", email = "bubu@bubudroid.me" } ]
authors = [ { name = "Hsiaoming Yang", email = "me@lepture.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment :: Mozilla",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Debuggers",
]
dynamic = [ "version" ]
dependencies = [
  "tornado>=6.5.10",
]
optional-dependencies.notify = [
  "pyinotify>=0.9.6",
]
urls.Changelog = "https://github.com/lepture/python-livereload/blob/master/CHANGELOG.md"
urls.Documentation = "https://livereload.readthedocs.io"
urls.Issues = "https://github.com/lepture/python-livereload/issues"
urls.Repository = "https://github.com/lepture/python-livereload"
scripts.livereload = "livereload.cli:main"

[dependency-groups]
dev = [
  "prek>=0.5.5",
  "pytest>=8.4.2",
]

[tool.hatch]
version.path = "src/livereload/__init__.py"
build.targets.wheel.packages = [ "src/livereload" ]
build.targets.sdist.include = [ "/src", "/tests", "/docs", "/CHANGELOG.md" ]

[tool.ruff]
line-length = 80
lint.extend-select = [ "ANN" ]
lint.unfixable = [ "F401" ]

[tool.basedpyright]
executionEnvironments = [
  { root = "tests", reportPrivateUsage = false },
]
