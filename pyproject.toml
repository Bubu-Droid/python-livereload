[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "livereload"
description = "Python LiveReload is an awesome tool for web developers"
readme = "README.md"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [ { name = "Hsiaoming Yang", email = "me@lepture.com" } ]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment :: Mozilla",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Debuggers",
]
dynamic = [ "version" ]
dependencies = [ "tornado" ]
urls.Changelog = "https://github.com/lepture/python-livereload/blob/master/CHANGES.rst"
urls.Documentation = "https://livereload.readthedocs.io"
urls.Homepage = "https://github.com/lepture/python-livereload"
urls.Source = "https://github.com/lepture/python-livereload"
scripts.livereload = "livereload.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19.1",
  "pytest>=8.4.2",
  "ruff>=0.17.1",
  "typing-extensions>=4.16",
]

[tool.hatch]
version.path = "src/livereload/__init__.py"
build.targets.wheel.packages = [ "src/livereload" ]
build.targets.sdist.include = [ "/src", "/tests", "/docs", "/CHANGES.rst" ]

[tool.ruff]
target-version = "py39"
src = [ "src" ]
lint.select = [ "B", "E", "F", "UP", "W" ]

[tool.mypy]
files = [ "src" ]
strict = true
overrides = [
  { module = [ "django.*", "pyinotify" ], ignore_missing_imports = true },
  # BaseCommand is untyped without django-stubs.
  { module = "livereload.management.*", disallow_subclassing_any = false }
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
